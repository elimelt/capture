<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Timebox" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#F8F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1918" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Timebox</title>
    <!-- Boot splash: pure HTML/CSS so it paints before the JS bundle loads.
         App.tsx fades it out once the store is hydrated. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8f6f3;
        transition: opacity 0.35s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash p {
        margin: 0;
        font-family: 'Libertinus Serif', ui-serif, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #2c2b29;
      }
      #splash .dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #3a605b;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #1a1918; }
        #splash p { color: #ebe9e4; }
        #splash .dot { background: #5a8c85; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <p>Timebox</p>
      <div class="dot"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
