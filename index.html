<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP (SPEC §9.2): no third-party runtime scripts except GIS. Drive/Calendar
         are fetch()'d from googleapis.com; GIS connects to accounts.google.com;
         token revoke on disconnect hits oauth2.googleapis.com; the assistant streams
         from llm.elimelt.com and transcription posts to transcribe.elimelt.com; the
         map loads OSM tiles from *.tile.openstreetmap.org (img + SW fetch) and
         reverse-geocodes via nominatim.openstreetmap.org; Google Fonts serve
         CSS/woff. React escaping only — no inline scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://llm.elimelt.com https://transcribe.elimelt.com https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://accounts.google.com; base-uri 'self'; object-src 'none'"
    />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Timebox" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="theme-color" content="#F8F6F3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1918" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Timebox</title>
    <!-- Google Identity Services: the only third-party runtime script (§8.1/§9.2).
         Async + defer so it never blocks the offline-first capture shell. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Boot splash: pure HTML/CSS so it paints before the JS bundle loads.
         App.tsx fades it out once the store is hydrated. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8f6f3;
        transition: opacity 0.35s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash p {
        margin: 0;
        font-family: 'Libertinus Serif', ui-serif, Georgia, serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #2c2b29;
      }
      #splash .dot {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #3a605b;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #1a1918; }
        #splash p { color: #ebe9e4; }
        #splash .dot { background: #5a8c85; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <p>Timebox</p>
      <div class="dot"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
